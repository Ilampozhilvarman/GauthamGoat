  <circle cx="45" cy="146" r="7" fill="#ffffff"/>
  <circle cx="75" cy="148" r="7" fill="#ffffff"/>
  <circle cx="105" cy="146" r="7" fill="#ffffff"/>
  <circle cx="135" cy="148" r="7" fill="#ffffff"/>
  <circle cx="160" cy="146" r="7" fill="#ffffff"/>

  <!-- top tier -->
  <rect x="55" y="90" width="90" height="45" rx="10" fill="#a1c4fd"/>
  <rect x="55" y="90" width="90" height="12" rx="6" fill="#ffffff"/>
  <circle cx="65" cy="97" r="6" fill="#ffffff"/>
  <circle cx="90" cy="98" r="6" fill="#ffffff"/>
  <circle cx="115" cy="97" r="6" fill="#ffffff"/>
  <circle cx="135" cy="98" r="6" fill="#ffffff"/>

