  <ellipse cx="78" cy="58" rx="5" ry="8" fill="#ffcc4d"/>
  <ellipse cx="100" cy="53" rx="5" ry="8" fill="#ffcc4d"/>
  <ellipse cx="122" cy="58" rx="5" ry="8" fill="#ffcc4d"/>
  <ellipse cx="78" cy="60" rx="2.5" ry="4" fill="#ff6b6b"/>
